<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Title -->
    <title>{% block title %}{% endblock %}</title>
    
    <!-- Single Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=PT+Sans:400,700&family=Roboto:wght@100&family=Water+Brush&display=swap" rel="stylesheet">
    
    <!-- Your Custom CSS -->
    <link rel="stylesheet" href="/static/styles/style.css"/>
    <link rel="stylesheet" href="/static/styles/header.css"/>
    <link rel="stylesheet" href="/static/styles/section.css"/>
    <link rel="stylesheet" href="/static/styles/modal-content.css"/>
    <link rel="stylesheet" href="/static/styles/add_button.css"/>
    <link rel="stylesheet" href="/static/styles/kebab_button.css"/>
    <link rel="stylesheet" href="/static/styles/index.css"/>
    <link rel="stylesheet" href="/static/styles/post_detail.css"/>
    <!-- Other CSS -->
    <link rel="canonical" href="{{ request.build_absolute_uri }}" />
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body>
    {% block navbar %}{% endblock %}
    {% block content %}{% endblock %}

    <!-- Single Bootstrap 5 JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Your Custom JS -->
    <script src="/static/js/modal-content.js"></script>
    
    <!-- AOS Animation -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>

</body>
</html>
